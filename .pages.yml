# Teacher Nessa — editor visual en https://app.pagescms.org
# Se necesita autorizar la aplicacion de GitHub en el repositorio.
media:
  - name: documents
    label: Poster, fichas de gramatica y vocabulario, canciones PUBLICAS
    input: recursos
    output: /recursos
    rename: safe
    categories: [image, document, video, audio, spreadsheet]
  - name: photos
    label: Imagenes PUBLICAS
    input: assets/uploads
    output: /assets/uploads
    rename: safe
    categories: [image]
content:
  - name: material
    label: Materiales revisados de Ingles y Atencion Educativa
    type: collection
    path: content/materiales
    format: json
    filename: "{id}.json"
    view:
      primary: title
      fields: [id, title, category, published, download_enabled]
    fields:
      - name: id
        label: Codigo identificativo (unico)
        type: string
        required: true
      - name: title
        label: Titulo
        type: string
        required: true
      - name: description
        label: Descripcion
        type: text
      - name: usage
        label: Ejemplo de uso en clase
        type: text
      - name: category
        label: Curso: Ingles 1 ESO, Ingles 2 ESO, ambos o Atencion Educativa de 1 ESO
        type: select
        required: true
        options:
          values: ["Inglés 1.º ESO", "Inglés 2.º ESO", "Inglés 1.º y 2.º", "Atención Educativa"]
      - name: topic
        label: Bloque o tema
        type: string
      - name: public_kind
        label: Tipo de material para la web publica
        type: select
        options:
          values: ["Gramática", "Vocabulario", "Canciones", "Rúbricas", "Atención Educativa"]
        description: "Inglés 1.º y 2.º ESO: gramática, vocabulario, canciones y rúbricas. Atención Educativa: materiales en español de 1.º ESO. No publicar programaciones ni documentos internos."
      - name: music_group
        label: Grupo real de esta cancion (solo MP3)
        type: select
        options:
          values: ["1A", "1B", "1C", "2A", "2B", "AE", "GENERAL"]
        description: "Escucha el MP3 antes de elegir 1A, 1B, 2A, etc. No basta con el nombre del archivo."
      - name: audio_verified
        label: He escuchado el MP3 y confirmado que la cancion y el grupo son correctos
        type: boolean
      - name: listen_enabled
        label: Permitir escuchar esta cancion en la web
        type: boolean
      - name: reference_file
        label: Nombre del fichero original (solo informativo)
        type: string
      - name: published
        label: Mostrar ficha en la web
        type: boolean
      - name: asset
        label: Archivo principal (poster PDF, imagen, audio o video)
        type: file
        options:
          media: documents
      - name: extra_asset
        label: Segundo archivo de la misma ficha (opcional)
        type: file
        options:
          media: documents
      - name: download_enabled
        label: Permitir descargar el archivo (independiente de escucharlo)
        type: boolean
      - name: rights_checked
        label: Confirmo revision de derechos de autor
        type: boolean
      - name: privacy_checked
        label: Confirmo revision de privacidad
        type: boolean
      - name: thumbnail
        label: Imagen de portada (opcional)
        type: image
        options:
          media: photos
      - name: featured
        label: Destacado
        type: boolean
      - name: internal
        label: Recurso interno (no descargar)
        type: boolean
      - name: editor_notes
        label: Notas para la docente
        type: text
  - name: posters
    label: Posters originales · Subir, sustituir, ocultar o borrar
    type: collection
    path: content/posters
    format: json
    filename: "{id}.json"
    view:
      primary: title
      fields: [id, title, level, published]
    fields:
      - name: id
        label: Codigo unico (ejemplo POSTER-100)
        type: string
        required: true
      - name: title
        label: Titulo visible
        type: string
        required: true
      - name: description
        label: Descripcion
        type: text
      - name: usage
        label: Instrucciones y ejemplo de uso
        type: text
      - name: topic
        label: Tema de vocabulario o gramatica
        type: string
      - name: level
        label: Curso al que corresponde
        type: select
        required: true
        options:
          values:
            - {name: 1ESO, label: "Inglés 1.º ESO"}
            - {name: 2ESO, label: "Inglés 2.º ESO"}
            - {name: ATENCION, label: "Atención Educativa 1.º ESO"}
            - {name: AMBOS, label: "Inglés 1.º y 2.º ESO"}
      - name: kind
        label: Tipo de poster
        type: select
        required: true
        options:
          values: ["Gramática", "Vocabulario", "Canciones", "Rúbricas", "Atención Educativa"]
      - name: asset
        label: Imagen o PDF original (reemplazable)
        type: file
        required: true
        options:
          media: documents
      - name: published
        label: Mostrar este poster en la web
        type: boolean
      - name: download_enabled
        label: Permitir descarga
        type: boolean
      - name: rights_checked
        label: Derechos de uso revisados
        type: boolean
      - name: privacy_checked
        label: Privacidad revisada
        type: boolean
      - name: internal
        label: Ocultar por ser material interno
        type: boolean
  - name: quiz
    label: Mini reto · Preguntas editables
    type: collection
    path: content/quiz
    format: json
    filename: "{id}.json"
    view:
      primary: question
      fields: [id, question, published, sort]
    fields:
      - name: id
        label: Codigo unico de pregunta
        type: string
        required: true
      - name: question
        label: Pregunta (ingles)
        type: string
        required: true
      - name: answer_a
        label: Opcion 1
        type: string
      - name: answer_b
        label: Opcion 2
        type: string
      - name: answer_c
        label: Opcion 3
        type: string
      - name: correct_index
        label: Numero de respuesta correcta (0 primera, 1 segunda, 2 tercera)
        type: number
      - name: explanation
        label: Explicacion al responder
        type: text
      - name: sort
        label: Orden de la pregunta
        type: number
      - name: published
        label: Mostrar esta pregunta
        type: boolean
  - name: novedades
    label: Novedades y noticias
    type: collection
    path: content/novedades
    format: json
    filename: "{title}.json"
    view:
      primary: title
      fields: [title, published]
    fields:
      - name: title
        label: Titulo de la noticia
        type: string
        required: true
      - name: body
        label: Texto
        type: text
      - name: image
        label: Imagen (opcional)
        type: image
        options:
          media: photos
      - name: sort
        label: Orden de presentacion
        type: number
      - name: published
        label: Mostrar noticia
        type: boolean
  - name: site
    label: "00 · Configuración general y avisos de portada"
    type: file
    path: content/sitio.json
    format: json
    fields:
      - name: site_title
        label: Nombre de la web
        type: string
      - name: tagline
        label: Lema
        type: string
      - name: intro
        label: Texto de bienvenida
        type: text
      - name: resource_intro
        label: Introduccion al catalogo
        type: text
      - name: notice
        label: Aviso de la portada
        type: text
      - name: resources_footer_note
        label: Texto debajo de Mostrar mas materiales (dejar vacio para ocultar)
        type: text
      - name: music_pending_note
        label: Aviso principal debajo del disco cuando no hay canciones publicadas (dejar vacio para ocultar)
        type: text
      - name: music_disclaimer
        label: Nota pequena al final de la seccion musical (dejar vacio para ocultar)
        type: text
      - name: instagram
        label: Enlace de Instagram
        type: string
      - name: x
        label: Enlace de X
        type: string
      - name: hero_image
        label: Foto propia de portada (opcional)
        type: image
        options:
          media: photos
      - name: show_music
        label: Mostrar rincón musical
        type: boolean

